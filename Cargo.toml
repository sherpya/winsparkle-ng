[package]
name = "winsparkle-ng"
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Gianluigi Tiesi <sherpya@gmail.com>"]
description = "Native Windows Sparkle-compatible updater with a stable C ABI"
build = "build.rs"

[lib]
name = "WinSparkle"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["xtask", "spikes/http"]
default-members = ["."]
resolver = "3"

[features]
default = ["signature-ed25519"]
signature-ed25519 = ["dep:ed25519-dalek", "dep:base64"]

[dependencies]
quick-xml = { version = "0.42", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize"], optional = true }
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = { version = "3", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
