name: Windows DLL
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.arch != 'arm64'
        run: cargo test --locked --workspace --exclude http-spike --target ${{ matrix.target }}
      - if: matrix.arch == 'arm64'
        run: cargo test --locked --workspace --exclude http-spike --target ${{ matrix.target }} --no-run
      - if: matrix.arch == 'x64'
        run: cargo test --locked --test http --target ${{ matrix.target }} native_read_timeout -- --ignored
      - run: cargo build --locked --target ${{ matrix.target }}
      - if: matrix.arch == 'x64'
        run: |
          python -m pip install cryptography
          python tests/python/test_ctypes.py
      - run: ./tools/package.ps1 -Arch ${{ matrix.arch }}
      - run: ./tools/abi-smoke.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: WinSparkle-NG-${{ matrix.arch }}
          path: |
            dist/*.zip
            artifacts/metrics-*.json
            artifacts/pe-*.json
            artifacts/cargo-tree-*.txt
            artifacts/abi-*/exports.txt
  release:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WinSparkle-NG-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-artifacts/dist/WinSparkle-NG-*.zip)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No release packages found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" --repo "$GH_REPO" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
